<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cadastro de Colaboradores</title>
                <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
                </head>
                <body class="w3-light-grey">

                    <div class="w3-container w3-content" style="max-width:600px; margin-top:40px;">
                            <div class="w3-card-4 w3-white w3-padding-large">
                                        <h2 class="w3-center w3-text-blue">Cadastro de Novos Colaboradores</h2>
                                                    <h4 class="w3-center">Lojas Brincos e Companhia</h4>
                                                                <hr>

                                                                            <form action="processaCadastro.php" method="POST">
                                                                                            <label><b>Nome Completo:</b></label>
                                                                                                            <input class="w3-input w3-border w3-round" type="text" name="nome" required>
                                                                                                                            <br>

                                                                                                                                            <label><b>Idade:</b></label>
                                                                                                                                                            <input class="w3-input w3-border w3-round" type="number" name="idade" required>
                                                                                                                                                                            <br>

                                                                                                                                                                                            <label><b>Profissão:</b></label>
                                                                                                                                                                                                            <input class="w3-input w3-border w3-round" type="text" name="profissao" required>
                                                                                                                                                                                                                            <br>

                                                                                                                                                                                                                                            <label><b>Salário Pretendido (R$):</b></label>
                                                                                                                                                                                                                                                            <input class="w3-input w3-border w3-round" type="number" step="0.01" name="salario" required>
                                                                                                                                                                                                                                                                            <br>

                                                                                                                                                                                                                                                                                            <label><b>Experiência Anterior:</b></label>
                                                                                                                                                                                                                                                                                                            <textarea class="w3-input w3-border w3-round" name="experiencia" rows="4" required></textarea>
                                                                                                                                                                                                                                                                                                                            <br>

                                                                                                                                                                                                                                                                                                                                            <button type="submit" class="w3-button w3-blue w3-block w3-round">Cadastrar</button>
                                                                                                                                                                                                                                                                                                                                                        </form>
                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                    </html>
